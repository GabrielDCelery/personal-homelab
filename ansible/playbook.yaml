- name: Baseline setup
  hosts: all
  vars:
    target_user: "{{ lookup('env', 'HOMELAB_USER') }}"
  roles:
    - role: info
      tags: info
    - role: docker
      tags: docker
    - role: git
      tags: git
    - role: homelab
      tags: homelab

- name: Set up GPU workloads
  hosts: gpu_hosts
  vars:
    target_user: "{{ lookup('env', 'HOMELAB_USER') }}"
  roles:
    - role: nvidia_driver
      tags: nvidia_driver
    - role: nvidia_container_toolkit
      tags: nvidia_container_toolkit
    - role: registry
      tags: registry
    - role: ollama
      tags: ollama
    - role: shadowrun-rag
      tags: shadowrun-rag
    - role: comfyui
      tags: comfyui
    - role: sd-scripts
      tags: sd-scripts

- name: Set up shared infra
  hosts: infra_hosts
  vars:
    target_user: "{{ lookup('env', 'HOMELAB_USER') }}"
  roles:
    - role: dns
      tags: dns
