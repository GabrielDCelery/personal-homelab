- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: /srv/node-exporter-textfile
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install dir-size metrics script
  ansible.builtin.copy:
    src: homelab-dir-size-metrics.sh
    dest: /usr/local/bin/homelab-dir-size-metrics.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install dir-size metrics systemd service
  ansible.builtin.copy:
    src: homelab-dir-size-metrics.service
    dest: /etc/systemd/system/homelab-dir-size-metrics.service
    mode: '0644'
  become: true
  register: dir_size_metrics_service

- name: Install dir-size metrics systemd timer
  ansible.builtin.copy:
    src: homelab-dir-size-metrics.timer
    dest: /etc/systemd/system/homelab-dir-size-metrics.timer
    mode: '0644'
  become: true
  register: dir_size_metrics_timer

- name: Enable and start dir-size metrics timer
  ansible.builtin.systemd:
    name: homelab-dir-size-metrics.timer
    enabled: true
    state: started
    daemon_reload: "{{ dir_size_metrics_service.changed or dir_size_metrics_timer.changed }}"
  become: true
