services:
  technitium-dns:
    image: technitium/dns-server:14.3.0
    container_name: technitium-dns
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "5380:5380"
    volumes:
      - /srv/technitium:/etc/dns
    networks:
      - homelab

networks:
  homelab:
    external: true
