apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/homelab-overview.json
  - name: grafana-dashboard-provider
    files:
      - provisioning/provider.yaml
  - name: grafana-datasources
    files:
      - provisioning/datasource.yaml
