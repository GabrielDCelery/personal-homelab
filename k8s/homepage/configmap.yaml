apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  services.yaml: |
    - Homelab:
        - Technitium:
            icon: technitium.svg
            href: https://technitium.home.gaborzeller.com
            description: DNS + ad blocking
        - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.home.gaborzeller.com
            description: Prometheus
            widget:
              type: prometheus
              url: http://prometheus:9090
        - Grafana:
            icon: grafana.svg
            href: https://grafana.home.gaborzeller.com
            description: Grafana
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.home.gaborzeller.com
            description: Jellyfin
  settings.yaml: |
    layout:
      Homelab:
        style: row
        columns: 2
        header: false
  bookmarks.yaml: ""
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        uptime: true
  docker.yaml: ""
  kubernetes.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
