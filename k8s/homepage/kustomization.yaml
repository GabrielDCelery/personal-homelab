apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: homepage-config
    files:
      - config/services.yaml
      - config/settings.yaml
      - config/bookmarks.yaml
      - config/widgets.yaml
      - config/docker.yaml
      - config/kubernetes.yaml
      - config/custom.css
      - config/custom.js
      - config/proxmox.yaml
