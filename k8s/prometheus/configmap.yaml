apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.default.svc.cluster.local:8080"]

      - job_name: node-exporter
        static_configs:
          - targets: ["10.83.16.98:9100"]
            labels:
              node_name: nuc
