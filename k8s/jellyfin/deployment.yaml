apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        supplementalGroups:
          - 991
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          hostPath:
            path: /srv/jellyfin/config
            type: Directory
        - name: media
          hostPath:
            path: /srv/jellyfin/media
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
