apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniflux
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`miniflux.home.gaborzeller.com`)
      kind: Rule
      services:
        - name: miniflux
          port: 8080
  tls:
    certResolver: cloudflare
    domains:
      - main: "*.home.gaborzeller.com"
